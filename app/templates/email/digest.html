<!doctype html>
<html><body style="margin:0;padding:24px;background:#F3F5F7;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#15202B;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#FFFFFF;border:1px solid #D5DBE1;border-radius:10px;">
    <tr><td style="padding:28px 28px 8px;">
      <p style="margin:0 0 4px;font-size:14px;color:#5B6775;">{{ app_name }} weekly summary</p>
      <p style="margin:0;font-size:22px;font-weight:600;line-height:1.3;">{{ count }} spam email{{ '' if count == 1 else 's' }} kept out of your inbox</p>
    </td></tr>
    <tr><td style="padding:16px 28px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;">
        {% for name, n in top %}
        <tr>
          <td style="padding:6px 0;border-bottom:1px solid #E6EAEE;font-family:Menlo,Consolas,monospace;font-size:13px;">{{ name }}</td>
          <td style="padding:6px 0;border-bottom:1px solid #E6EAEE;text-align:right;color:#5B6775;">{{ n }}</td>
        </tr>
        {% endfor %}
      </table>
    </td></tr>
    <tr><td style="padding:8px 28px 28px;font-size:14px;line-height:1.5;">
      <p style="margin:0 0 16px;">Caught something you wanted? You can move it back in one click.</p>
      <a href="{{ activity_url }}" style="display:inline-block;background:#2F4BD8;color:#FFFFFF;text-decoration:none;padding:10px 16px;border-radius:6px;font-weight:600;">Review activity</a>
      <p style="margin:24px 0 0;font-size:12px;color:#5B6775;"><a href="{{ settings_url }}" style="color:#5B6775;">Turn off weekly summaries</a></p>
    </td></tr>
  </table>
</body></html>
